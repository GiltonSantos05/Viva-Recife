<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google maps</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="map.css">
</head>
<body>
    <div class="position-absolute top-0 start-50 translate-middle-x mt-3 z-3 d-flex justify-content-center w-100">
        <div class="input-group" style="max-width: 600px;">
            <input type="text" id="searchInput" class="form-control" placeholder="Busque por um local...">
            <button class="btn btn-primary" id="searchBtn"> Buscar </button>
        </div>
    </div>

    <div id="map" class="w-100 h-100 z-0">
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>
        <script src="map.js"></script>
    </div>
</body>
</html>
